name: MCP Server Publish

on:
  workflow_call:
    inputs:
      version:
        description: "Released version to publish, without the v prefix. Builds the matching release tag."
        required: true
        type: string
  # Republishes an existing release, e.g. to roll back.
  workflow_dispatch:
    inputs:
      version:
        description: "MCP server version to republish, without the v prefix"
        required: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: gustmrg/bitfinance-mcp-server
  PROJECT_FILE: apps/mcp-server/src/BitFinance.MCP.csproj

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: mcp-server/v${{ inputs.version }}

      - name: Set release version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version must be semver without the v prefix. Received '$VERSION'."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate project version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          PROJECT_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT_FILE" | head -n 1)"

          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::$PROJECT_FILE must define a <Version> value."
            exit 1
          fi

          echo "Release version: $RELEASE_VERSION"
          echo "Project version: $PROJECT_VERSION"

          if [ "$RELEASE_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Version mismatch: MCP release '$RELEASE_VERSION' does not match project version '$PROJECT_VERSION'."
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact-suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact-suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: mcp-server/v${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./apps/mcp-server
          file: ./apps/mcp-server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcp-${{ matrix.platform }}
          cache-to: type=gha,scope=mcp-${{ matrix.platform }},mode=max
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: mcp-digests-${{ matrix.artifact-suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: mcp-digests-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$IMAGE_REF:$VERSION" \
            -t "$IMAGE_REF:latest" \
            $(printf "$IMAGE_REF@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE_REF:$VERSION"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - validate
      - publish
    environment: production

    steps:
      - name: Checkout compose file
        uses: actions/checkout@v6
        with:
          ref: mcp-server/v${{ needs.validate.outputs.version }}
          sparse-checkout: |
            apps/mcp-server/docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy MCP server
        env:
          MCP_IMAGE_TAG: ${{ needs.validate.outputs.version }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_IP: ${{ secrets.SSH_HOST }}
          TAILSCALE_HOST: ${{ secrets.TAILSCALE_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_PATH" ]; then
            echo "::error::The DEPLOY_PATH secret is not set."
            exit 1
          fi

          TARGET_HOST="${TAILSCALE_HOST:-$SSH_HOST_IP}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$TARGET_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SSH_OPTS=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )

          MCP_DEPLOY_PATH="$DEPLOY_PATH/mcp-server"

          echo "Uploading compose file from mcp-server/v$MCP_IMAGE_TAG..."
          scp -i "$KEY_FILE" -P "$SSH_PORT" "${SSH_OPTS[@]}" \
            apps/mcp-server/docker-compose.yml \
            "$SSH_USERNAME@$TARGET_HOST:$MCP_DEPLOY_PATH/docker-compose.yml.new"

          printf -v REMOTE_MCP_IMAGE_TAG '%q' "$MCP_IMAGE_TAG"
          printf -v REMOTE_MCP_DEPLOY_PATH '%q' "$MCP_DEPLOY_PATH"

          ssh -i "$KEY_FILE" -p "$SSH_PORT" "${SSH_OPTS[@]}" \
            "$SSH_USERNAME@$TARGET_HOST" \
            "MCP_IMAGE_TAG=$REMOTE_MCP_IMAGE_TAG MCP_DEPLOY_PATH=$REMOTE_MCP_DEPLOY_PATH bash -s" <<'REMOTE'
          set -euo pipefail

          COMPOSE_FILES=(-f docker-compose.yml)
          cd "$MCP_DEPLOY_PATH"

          for file in docker-compose.yml.new .env; do
            if [ ! -f "$file" ]; then
              echo "::error::Required deploy file is missing: $MCP_DEPLOY_PATH/$file"
              exit 1
            fi
          done

          # Compose only warns about variables missing from .env and then uses
          # an empty value, so treat that warning as a failure too.
          echo "Validating the release's compose file against .env..."
          if ! CHECK_OUTPUT="$(docker compose -f docker-compose.yml.new config -q 2>&1)" \
            || grep -q 'variable is not set' <<<"$CHECK_OUTPUT"; then
            printf '%s\n' "$CHECK_OUTPUT"
            rm -f docker-compose.yml.new
            echo "::error::The release's compose file does not work with the server's .env. The current compose file was left in place."
            exit 1
          fi

          if [ -f docker-compose.yml ]; then
            cp -p docker-compose.yml docker-compose.yml.prev
          fi
          mv docker-compose.yml.new docker-compose.yml
          echo "Compose file updated from the release (previous version kept as docker-compose.yml.prev)"

          echo "Pulling MCP server image tag: $MCP_IMAGE_TAG"
          docker compose "${COMPOSE_FILES[@]}" pull bitfinance-mcp-server
          docker compose "${COMPOSE_FILES[@]}" up -d --no-build --wait --wait-timeout 120 bitfinance-mcp-server

          EXPECTED_IMAGE="gustmrg/bitfinance-mcp-server:$MCP_IMAGE_TAG"
          RUNNING_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$(docker compose "${COMPOSE_FILES[@]}" ps -q bitfinance-mcp-server)")"
          if [ "$RUNNING_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "::error::MCP server is running '$RUNNING_IMAGE', expected '$EXPECTED_IMAGE'."
            exit 1
          fi
          echo "MCP server is running $RUNNING_IMAGE"

          if grep -q '^MCP_IMAGE_TAG=' .env; then
            sed -i "s/^MCP_IMAGE_TAG=.*/MCP_IMAGE_TAG=$MCP_IMAGE_TAG/" .env
          else
            printf '%s=%s\n' MCP_IMAGE_TAG "$MCP_IMAGE_TAG" >> .env
          fi
          echo "Recorded MCP_IMAGE_TAG=$MCP_IMAGE_TAG in .env"
          REMOTE
