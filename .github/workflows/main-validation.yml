name: Main Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - '.github/workflows/frontend-deploy.yml'
              - '.github/workflows/main-validation.yml'
            backend:
              - 'apps/backend/**'
              - '.github/workflows/backend-docker-publish.yml'
              - '.github/workflows/main-validation.yml'
            mcp:
              - 'apps/mcp-server/**'
              - '.github/workflows/mcp-docker-publish.yml'
              - '.github/workflows/main-validation.yml'
            cli:
              - 'apps/cli/**'
              - '.github/workflows/cli-release.yml'
              - '.github/workflows/main-validation.yml'

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm run format:check

      - name: Lint frontend
        run: pnpm run lint

      - name: Build frontend
        run: pnpm run build

  backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-backend-${{ hashFiles('apps/backend/src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-backend-

      - name: Build backend
        run: dotnet build apps/backend/BitFinance.sln --disable-build-servers -v:minimal

      - name: Test backend
        run: dotnet test apps/backend/BitFinance.sln --no-build --disable-build-servers -v:minimal

  mcp:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-mcp-${{ hashFiles('apps/mcp-server/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-mcp-

      - name: Build MCP server
        run: dotnet build apps/mcp-server/src/BitFinance.MCP.csproj --disable-build-servers -v:minimal

      - name: Test MCP server
        run: dotnet test apps/mcp-server/tests/BitFinance.MCP.UnitTests/BitFinance.MCP.UnitTests.csproj --disable-build-servers -v:minimal

  cli:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-cli-${{ hashFiles('apps/cli/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-cli-

      - name: Build CLI
        run: dotnet build apps/cli/src/BitFinance.Cli.csproj --disable-build-servers -v:minimal

      - name: Test CLI
        run: dotnet test apps/cli/tests/BitFinance.Cli.UnitTests/BitFinance.Cli.UnitTests.csproj --disable-build-servers -v:minimal
