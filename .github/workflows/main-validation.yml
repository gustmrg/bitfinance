name: Main Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      frontend_v2: ${{ steps.filter.outputs.frontend_v2 }}
      backend: ${{ steps.filter.outputs.backend }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - '.github/workflows/frontend-deploy.yml'
              - '.github/workflows/main-validation.yml'
            frontend_v2:
              - 'apps/frontend-v2/**'
              - '.github/workflows/main-validation.yml'
            backend:
              - 'apps/backend/**'
              - '.github/workflows/backend-docker-publish.yml'
              - '.github/workflows/main-validation.yml'
            mcp:
              - 'apps/mcp-server/**'
              - '.github/workflows/mcp-docker-publish.yml'
              - '.github/workflows/main-validation.yml'

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

  frontend-v2:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend_v2 == 'true'
    defaults:
      run:
        working-directory: apps/frontend-v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/frontend-v2/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend-v2
        run: pnpm run lint

      - name: Test frontend-v2
        run: pnpm run test

      - name: Build frontend-v2
        run: pnpm run build

  backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-backend-${{ hashFiles('apps/backend/src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-backend-

      - name: Build backend
        run: dotnet build apps/backend/BitFinance.sln --disable-build-servers -v:minimal

  mcp:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-mcp-${{ hashFiles('apps/mcp-server/src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-mcp-

      - name: Build MCP server
        run: dotnet build apps/mcp-server/src/BitFinance.MCP.csproj --disable-build-servers -v:minimal
