name: Backend Publish

on:
  workflow_call:
    inputs:
      version:
        description: "Released version to publish, without the v prefix. Builds the matching release tag."
        required: true
        type: string
  # Republishes an existing release, e.g. to roll back.
  workflow_dispatch:
    inputs:
      version:
        description: "Backend version to republish, without the v prefix"
        required: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: gustmrg/bitfinance-backend
  PROJECT_FILE: apps/backend/src/BitFinance.API/BitFinance.API.csproj

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: backend/v${{ inputs.version }}

      - name: Set release version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version must be semver without the v prefix. Received '$VERSION'."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate project version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          PROJECT_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT_FILE" | head -n 1)"

          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::$PROJECT_FILE must define a <Version> value."
            exit 1
          fi

          echo "Release version: $RELEASE_VERSION"
          echo "Project version: $PROJECT_VERSION"

          if [ "$RELEASE_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Version mismatch: backend release '$RELEASE_VERSION' does not match project version '$PROJECT_VERSION'."
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact-suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact-suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: backend/v${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./apps/backend/src
          file: ./apps/backend/src/BitFinance.API/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-${{ matrix.platform }}
          cache-to: type=gha,scope=backend-${{ matrix.platform }},mode=max
          build-args: |
            BUILD_CONFIGURATION=Release
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: backend-digests-${{ matrix.artifact-suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: backend-digests-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$IMAGE_REF:$VERSION" \
            -t "$IMAGE_REF:latest" \
            $(printf "$IMAGE_REF@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE_REF:$VERSION"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - validate
      - publish
    environment: production

    steps:
      - name: Checkout compose files
        uses: actions/checkout@v6
        with:
          ref: backend/v${{ needs.validate.outputs.version }}
          sparse-checkout: |
            apps/backend/docker-compose.yml
            apps/backend/docker-compose.prod.yml
          sparse-checkout-cone-mode: false

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy backend
        env:
          IMAGE_TAG: ${{ needs.validate.outputs.version }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_IP: ${{ secrets.SSH_HOST }}
          TAILSCALE_HOST: ${{ secrets.TAILSCALE_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_PATH" ]; then
            echo "::error::The DEPLOY_PATH secret is not set."
            exit 1
          fi

          TARGET_HOST="${TAILSCALE_HOST:-$SSH_HOST_IP}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$TARGET_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SSH_OPTS=(
            -i "$KEY_FILE"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )

          echo "Checking SSH connectivity to deployment host..."
          ssh "${SSH_OPTS[@]}" "$SSH_USERNAME@$TARGET_HOST" \
            'echo "SSH auth OK"; echo "Remote host: $(hostname)"'

          echo "Uploading compose files from backend/v$IMAGE_TAG..."
          for file in docker-compose.yml docker-compose.prod.yml; do
            scp -i "$KEY_FILE" -P "$SSH_PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "apps/backend/$file" "$SSH_USERNAME@$TARGET_HOST:$DEPLOY_PATH/$file.new"
          done

          printf -v REMOTE_IMAGE_TAG '%q' "$IMAGE_TAG"
          printf -v REMOTE_DEPLOY_PATH '%q' "$DEPLOY_PATH"

          ssh "${SSH_OPTS[@]}" "$SSH_USERNAME@$TARGET_HOST" \
            "IMAGE_TAG=$REMOTE_IMAGE_TAG DEPLOY_PATH=$REMOTE_DEPLOY_PATH bash -s" <<'REMOTE'
          set -Eeuo pipefail

          COMPOSE_FILES=(-f docker-compose.yml -f docker-compose.prod.yml)

          on_error() {
            status=$?
            line=$1
            echo "::error::Remote backend deploy failed at line ${line} with exit code ${status}"

            if [ -n "${DEPLOY_PATH:-}" ] && [ -d "$DEPLOY_PATH" ]; then
              cd "$DEPLOY_PATH" || true
              echo "Compose status after failure:"
              docker compose "${COMPOSE_FILES[@]}" ps bitfinance-api || true
              echo "Recent backend logs after failure:"
              docker compose "${COMPOSE_FILES[@]}" logs --tail 60 bitfinance-api || true
            fi

            exit "$status"
          }

          trap 'on_error $LINENO' ERR

          echo "Deploy path: $DEPLOY_PATH"
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "::error::Deploy path does not exist: $DEPLOY_PATH"
            exit 1
          fi

          cd "$DEPLOY_PATH"
          echo "Current directory: $(pwd)"

          for file in docker-compose.yml.new docker-compose.prod.yml.new .env; do
            if [ ! -f "$file" ]; then
              echo "::error::Required deploy file is missing: $file"
              exit 1
            fi
          done

          # Compose only warns about variables missing from .env and then uses
          # an empty value, so treat that warning as a failure too.
          echo "Validating the release's compose files against .env..."
          if ! CHECK_OUTPUT="$(docker compose -f docker-compose.yml.new -f docker-compose.prod.yml.new config -q 2>&1)" \
            || grep -q 'variable is not set' <<<"$CHECK_OUTPUT"; then
            printf '%s\n' "$CHECK_OUTPUT"
            rm -f docker-compose.yml.new docker-compose.prod.yml.new
            echo "::error::The release's compose files do not work with the server's .env. The current compose files were left in place."
            exit 1
          fi

          for file in docker-compose.yml docker-compose.prod.yml; do
            if [ -f "$file" ]; then
              cp -p "$file" "$file.prev"
            fi
            mv "$file.new" "$file"
          done
          echo "Compose files updated from the release (previous versions kept as *.prev)"

          echo "Compose services:"
          docker compose "${COMPOSE_FILES[@]}" config --services

          echo "Pulling backend image tag: $IMAGE_TAG"
          IMAGE_TAG="$IMAGE_TAG" docker compose "${COMPOSE_FILES[@]}" pull bitfinance-api

          echo "Applying database migrations with image tag: $IMAGE_TAG"
          # This script is read from stdin, so the migration container must not
          # inherit it: it would consume the rest of the script and the deploy
          # would end here with exit code 0, leaving the old container running.
          IMAGE_TAG="$IMAGE_TAG" docker compose "${COMPOSE_FILES[@]}" run -T --rm --no-deps bitfinance-api --migrate </dev/null

          echo "Starting backend service with image tag: $IMAGE_TAG"
          IMAGE_TAG="$IMAGE_TAG" docker compose "${COMPOSE_FILES[@]}" up -d --no-build --wait --wait-timeout 180 bitfinance-api

          echo "Backend service status:"
          docker compose "${COMPOSE_FILES[@]}" ps bitfinance-api

          EXPECTED_IMAGE="gustmrg/bitfinance-backend:$IMAGE_TAG"
          RUNNING_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$(docker compose "${COMPOSE_FILES[@]}" ps -q bitfinance-api)")"
          if [ "$RUNNING_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "::error::Backend is running '$RUNNING_IMAGE', expected '$EXPECTED_IMAGE'."
            exit 1
          fi
          echo "Backend is running $RUNNING_IMAGE"

          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
          else
            printf '%s=%s\n' IMAGE_TAG "$IMAGE_TAG" >> .env
          fi
          echo "Recorded IMAGE_TAG=$IMAGE_TAG in .env"

          echo "Recent backend logs:"
          docker compose "${COMPOSE_FILES[@]}" logs --tail 40 bitfinance-api
          REMOTE
