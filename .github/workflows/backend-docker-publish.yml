name: Backend Release

on:
  push:
    tags:
      - "backend/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Backend version to publish without the v prefix"
        required: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: gustmrg/bitfinance-backend
  PROJECT_FILE: apps/backend/src/BitFinance.API/BitFinance.API.csproj

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set release version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${REF_NAME#backend/v}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version must be semver without the v prefix. Received '$VERSION'."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate project version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          PROJECT_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT_FILE" | head -n 1)"

          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::$PROJECT_FILE must define a <Version> value."
            exit 1
          fi

          echo "Release version: $RELEASE_VERSION"
          echo "Project version: $PROJECT_VERSION"

          if [ "$RELEASE_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Version mismatch: backend release '$RELEASE_VERSION' does not match project version '$PROJECT_VERSION'."
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact-suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact-suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./apps/backend/src
          file: ./apps/backend/src/BitFinance.API/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-${{ matrix.platform }}
          cache-to: type=gha,scope=backend-${{ matrix.platform }},mode=max
          build-args: |
            BUILD_CONFIGURATION=Release
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: backend-digests-${{ matrix.artifact-suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: backend-digests-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$IMAGE_REF:$VERSION" \
            -t "$IMAGE_REF:latest" \
            $(printf "$IMAGE_REF@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE_REF:$VERSION"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - validate
      - publish
    environment: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy backend
        env:
          IMAGE_TAG: ${{ needs.validate.outputs.version }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_IP: ${{ secrets.SSH_HOST }}
          TAILSCALE_HOST: ${{ secrets.TAILSCALE_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/bitfinance/apps/backend' }}
        run: |
          set -euo pipefail

          TARGET_HOST="${TAILSCALE_HOST:-$SSH_HOST_IP}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$TARGET_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SSH_OPTS=(
            -i "$KEY_FILE"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )

          echo "Checking SSH connectivity to deployment host..."
          ssh "${SSH_OPTS[@]}" "$SSH_USERNAME@$TARGET_HOST" \
            'echo "SSH auth OK"; echo "Remote host: $(hostname)"'

          printf -v REMOTE_IMAGE_TAG '%q' "$IMAGE_TAG"
          printf -v REMOTE_DEPLOY_PATH '%q' "$DEPLOY_PATH"

          ssh "${SSH_OPTS[@]}" "$SSH_USERNAME@$TARGET_HOST" \
            "IMAGE_TAG=$REMOTE_IMAGE_TAG DEPLOY_PATH=$REMOTE_DEPLOY_PATH bash -s" <<'REMOTE'
          set -Eeuo pipefail

          COMPOSE_FILES=(-f docker-compose.yml -f docker-compose.prod.yml)

          on_error() {
            status=$?
            line=$1
            echo "::error::Remote backend deploy failed at line ${line} with exit code ${status}"

            if [ -n "${DEPLOY_PATH:-}" ] && [ -d "$DEPLOY_PATH" ]; then
              cd "$DEPLOY_PATH" || true
              echo "Compose status after failure:"
              docker compose "${COMPOSE_FILES[@]}" ps bitfinance-api || true
              echo "Recent backend logs after failure:"
              docker compose "${COMPOSE_FILES[@]}" logs --tail 60 bitfinance-api || true
            fi

            exit "$status"
          }

          trap 'on_error $LINENO' ERR

          echo "Deploy path: $DEPLOY_PATH"
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "::error::Deploy path does not exist: $DEPLOY_PATH"
            exit 1
          fi

          cd "$DEPLOY_PATH"
          echo "Current directory: $(pwd)"

          for file in docker-compose.yml docker-compose.prod.yml .env; do
            if [ ! -f "$file" ]; then
              echo "::error::Required deploy file is missing: $file"
              exit 1
            fi
          done

          echo "Compose services:"
          docker compose "${COMPOSE_FILES[@]}" config --services

          echo "Pulling backend image tag: $IMAGE_TAG"
          IMAGE_TAG="$IMAGE_TAG" docker compose "${COMPOSE_FILES[@]}" pull bitfinance-api

          echo "Applying database migrations with image tag: $IMAGE_TAG"
          IMAGE_TAG="$IMAGE_TAG" docker compose "${COMPOSE_FILES[@]}" run --rm --no-deps bitfinance-api --migrate

          echo "Starting backend service with image tag: $IMAGE_TAG"
          IMAGE_TAG="$IMAGE_TAG" docker compose "${COMPOSE_FILES[@]}" up -d --no-build bitfinance-api

          echo "Backend service status:"
          docker compose "${COMPOSE_FILES[@]}" ps bitfinance-api

          echo "Recent backend logs:"
          docker compose "${COMPOSE_FILES[@]}" logs --tail 40 bitfinance-api
          REMOTE
