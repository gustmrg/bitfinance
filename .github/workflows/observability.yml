name: Observability

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'apps/mcp-server/**'
      - '.github/workflows/observability.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'apps/mcp-server/**'
      - '.github/workflows/observability.yml'

permissions:
  contents: read

jobs:
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r apps/backend/observability/requirements-test.txt

      - name: Validate dashboard, alerts and compose isolation
        run: python apps/backend/observability/validate.py

      - name: Build API and MCP server
        run: |
          dotnet build apps/backend/BitFinance.sln --disable-build-servers -v:minimal
          dotnet build apps/mcp-server/src/BitFinance.MCP.csproj --disable-build-servers -v:minimal

      - name: Run end-to-end telemetry smoke test
        run: python apps/backend/observability/smoke-test.py
