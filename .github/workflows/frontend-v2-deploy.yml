name: Frontend v2 Release

on:
  push:
    tags:
      - "frontend-v2/v*"

permissions:
  contents: read

concurrency:
  group: frontend-v2-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/frontend-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set release version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#frontend-v2/v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version must be semver without the v prefix. Received '$VERSION'."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/frontend-v2/pnpm-lock.yaml

      - name: Validate package.json version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          echo "Release version: $RELEASE_VERSION"
          echo "package.json version: $PACKAGE_VERSION"

          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Version mismatch: frontend v2 release '$RELEASE_VERSION' does not match package.json version '$PACKAGE_VERSION'."
            exit 1
          fi

      - name: Set up production environment
        run: |
          cp .env.production.example .env.production
          cat .env.production >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint app
        run: pnpm run lint

      - name: Build app
        run: pnpm run build

      - name: Write version file
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");

          const version = {
            version: process.env.RELEASE_VERSION,
            commit: process.env.RELEASE_SHA,
            ref: process.env.RELEASE_REF,
            builtAt: new Date().toISOString()
          };

          fs.writeFileSync("dist/version.json", `${JSON.stringify(version, null, 2)}\n`);
          NODE

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy files
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_IP: ${{ secrets.SSH_HOST }}
          TAILSCALE_HOST: ${{ secrets.TAILSCALE_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: /var/www/bitfinance-v2
        run: |
          set -euo pipefail

          TARGET_HOST="${TAILSCALE_HOST:-$SSH_HOST_IP}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$TARGET_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          ssh -i "$KEY_FILE" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USERNAME@$TARGET_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

          scp -i "$KEY_FILE" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -r dist/* "$SSH_USERNAME@$TARGET_HOST:$DEPLOY_PATH/"

          ssh -i "$KEY_FILE" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USERNAME@$TARGET_HOST" \
            "test -f '$DEPLOY_PATH/index.html' && grep -F '\"version\": \"$RELEASE_VERSION\"' '$DEPLOY_PATH/version.json'"
