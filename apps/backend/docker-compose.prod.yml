# Production overlay — use on top of the base:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --no-build -d
services:
  bitfinance-api:
    image: gustmrg/bitfinance-backend:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - ConnectionStrings__Database=Host=bitfinance-db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - KeyVault__Url=${KEYVAULT_URL}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_0}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - Notifications__EmailEnabled=${NOTIFICATIONS_EMAIL_ENABLED}
      - Notifications__ResendApiToken=${RESEND_API_TOKEN}
      - Notifications__ResendWebhookSecret=${RESEND_WEBHOOK_SECRET}
      - Notifications__FromAddress=${NOTIFICATIONS_FROM_ADDRESS}
      - Notifications__FrontendBaseUrl=${NOTIFICATIONS_FRONTEND_BASE_URL}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bitfinance-mcp-server:
    image: gustmrg/bitfinance-mcp-server:${MCP_IMAGE_TAG:-latest}
    restart: always
    ports:
      - "${MCP_BIND_ADDRESS}:${MCP_PORT:-8090}:8090"
    environment:
      - ASPNETCORE_URLS=http://+:8090
      - BITFINANCE_API_BASE_URL=${MCP_API_BASE_URL:-http://bitfinance-api:8080}
      - BITFINANCE_AGENT_EMAIL=${MCP_AGENT_EMAIL}
      - BITFINANCE_AGENT_PASSWORD=${MCP_AGENT_PASSWORD}
      - BITFINANCE_DEFAULT_ORGANIZATION_ID=${MCP_DEFAULT_ORGANIZATION_ID:-}
      - BITFINANCE_API_VERSION=${MCP_API_VERSION:-1}
      - BITFINANCE_MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN}
    depends_on:
      - bitfinance-api
    networks:
      - bitfinance-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bitfinance-db:
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  bitfinance-cache:
    restart: always
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_DATA_VOLUME:-bitfinance_postgres-data}
  redis-data:
